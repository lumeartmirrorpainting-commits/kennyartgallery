<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kenny's Art | Original Paintings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { 
      background-color: #FAF8F5; 
      color: #1F2937; 
      font-family: 'Montserrat', sans-serif; 
      line-height: 1.5; 
      overflow-x: hidden; 
      width: 100%;
      min-height: 100vh;
    }
    .font-serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    
    /* Header & Navigation */
    header { 
      position: sticky; 
      top: 0; 
      z-index: 50; 
      background: rgba(250, 248, 245, 0.98); 
      backdrop-filter: blur(10px); 
      border-bottom: 1px solid #E5E7EB; 
      width: 100%; 
    }
    .nav-container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 0 16px; 
      height: 64px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
    }
    .nav-logo { 
      font-size: 1.25rem; 
      letter-spacing: 0.12em; 
      text-transform: uppercase; 
      font-weight: 600; 
      background: none; 
      border: none; 
      cursor: pointer; 
      color: #111827; 
    }
    .nav-links-desktop { display: none; align-items: center; gap: 20px; }
    .nav-btn { 
      background: none; 
      border: none; 
      font-size: 0.75rem; 
      letter-spacing: 0.12em; 
      text-transform: uppercase; 
      cursor: pointer; 
      color: #4B5563; 
      font-weight: 500; 
      transition: color 0.2s; 
      padding: 8px 4px; 
    }
    .nav-btn:hover { color: #111827; }
    .nav-btn-admin { color: #9CA3AF; font-weight: 600; }
    .btn-wa { 
      border: 1px solid #111827; 
      padding: 8px 14px; 
      text-decoration: none; 
      color: #111827; 
      font-size: 0.72rem; 
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      transition: all 0.2s; 
      font-weight: 600; 
      display: inline-block;
      text-align: center;
    }
    .btn-wa:hover { background: #111827; color: #FFF; }
    
    /* Hamburger Button */
    .hamburger { 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      gap: 5px; 
      width: 40px; 
      height: 40px; 
      background: none; 
      border: none; 
      cursor: pointer; 
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: #111827;
      transition: all 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    
    /* Mobile Drawer */
    #mobileDrawer {
      position: fixed;
      top: 64px;
      left: 0;
      width: 100%;
      height: calc(100vh - 64px);
      background: #FAF8F5;
      z-index: 49;
      display: flex;
      flex-direction: column;
      padding: 28px 20px;
      gap: 12px;
      border-top: 1px solid #E5E7EB;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #mobileDrawer.open { 
      transform: translateX(0); 
    }
    .mobile-nav-link { 
      text-align: left; 
      font-size: 1.2rem; 
      letter-spacing: 0.08em; 
      text-transform: uppercase; 
      padding: 14px 0; 
      border-bottom: 1px solid #E5E7EB; 
      color: #111827; 
      background: none; 
      border-left: none; 
      border-right: none; 
      border-top: none; 
      cursor: pointer; 
      width: 100%;
    }

    /* Layout */
    main { 
      min-height: 75vh; 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 20px 16px 60px 16px; 
      width: 100%; 
    }
    footer { 
      background: #F0ECE6; 
      border-top: 1px solid #E5E7EB; 
      padding: 32px 16px; 
      font-size: 0.8rem; 
    }
    .footer-container { 
      max-width: 1200px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      text-align: center; 
    }

    /* Hero Responsive */
    .hero-wrap { 
      display: flex; 
      flex-direction: column-reverse; 
      gap: 24px; 
      padding: 8px 0 28px 0; 
    }
    .hero-img-box { 
      width: 100%; 
      height: 250px; 
      background: #E5E7EB; 
      border: 1px solid #D1D5DB; 
      overflow: hidden; 
    }
    .hero-img-box img { width: 100%; height: 100%; object-fit: cover; }

    /* Cards & Grid */
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
    .art-card { cursor: pointer; border: 1px solid #E5E7EB; background: #FFF; transition: transform 0.2s; }
    .card-img-wrap { position: relative; width: 100%; height: 230px; background: #EEE; overflow: hidden; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; top: 10px; right: 10px; padding: 4px 8px; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
    .badge-avail { background: #111827; color: #FFF; }
    .badge-res { background: #92400E; color: #FFF; }
    .badge-sold { background: #9CA3AF; color: #FFF; }
    .card-body { padding: 16px; }
    .card-title { font-size: 1.25rem; margin-bottom: 4px; color: #111827; }
    .card-meta { font-size: 0.75rem; color: #6B7280; margin-bottom: 8px; }
    .card-price { font-size: 1rem; font-weight: 600; color: #111827; }

    /* Detail Page Responsive */
    .detail-wrap { display: flex; flex-direction: column; gap: 20px; }
    .detail-img-box { width: 100%; background: #E5E7EB; border: 1px solid #D1D5DB; max-height: 400px; overflow: hidden; }
    .detail-img-box img { width: 100%; height: auto; max-height: 400px; object-fit: contain; display: block; margin: 0 auto; }

    /* Social Share Box */
    .share-section { margin-top: 24px; padding: 16px 0; border-top: 1px solid #E5E7EB; }
    .share-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: #6B7280; margin-bottom: 10px; font-weight: 600; }
    .share-btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .share-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid #D1D5DB; background: #FFF; color: #1F2937; text-decoration: none; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    .share-btn:hover { border-color: #111827; background: #111827; color: #FFF; }

    /* About Section (Editorial text-only) */
    .about-editorial-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 0 40px 0;
    }
    .about-quote-box {
      border-left: 3px solid #111827;
      padding: 16px 20px;
      background: #F3F4F6;
      margin: 24px 0;
      font-style: italic;
      color: #374151;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Buttons & Inputs */
    .btn-primary { 
      background: #111827; 
      color: #FFF; 
      border: 1px solid #111827; 
      padding: 14px 20px; 
      font-size: 0.78rem; 
      letter-spacing: 0.12em; 
      text-transform: uppercase; 
      cursor: pointer; 
      font-weight: 600; 
      transition: 0.2s; 
      width: 100%; 
      text-align: center; 
      display: block;
      text-decoration: none;
    }
    .btn-primary:hover { background: #374151; }
    .btn-outline { 
      background: transparent; 
      color: #111827; 
      border: 1px solid #111827; 
      padding: 14px 20px; 
      font-size: 0.78rem; 
      letter-spacing: 0.12em; 
      text-transform: uppercase; 
      cursor: pointer; 
      font-weight: 600; 
      text-decoration: none; 
      text-align: center; 
      width: 100%; 
      display: block; 
    }
    .btn-outline:hover { background: #111827; color: #FFF; }
    .input-box { width: 100%; padding: 12px; border: 1px solid #D1D5DB; background: #FFF; font-family: inherit; font-size: 0.9rem; margin-top: 4px; }
    .input-box:focus { outline: none; border-color: #111827; }

    /* Sold Notice Box */
    .sold-notice-box { background: #F3F4F6; border: 1px solid #E5E7EB; padding: 16px 20px; text-align: center; margin-top: 8px; }
    .sold-notice-title { font-size: 1.1rem; color: #111827; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
    .sold-notice-text { font-size: 0.8rem; color: #6B7280; }

    /* Filter & Search Bar */
    .filter-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #E5E7EB; }
    .cat-scroll-box { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .cat-pill { white-space: nowrap; padding: 8px 14px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid #111827; background: transparent; cursor: pointer; }

    /* Admin Styles Responsive */
    .admin-card { background: #FFF; border: 1px solid #E5E7EB; padding: 20px 16px; margin-bottom: 20px; }
    .admin-grid-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .metric-box { background: #FFF; border: 1px solid #E5E7EB; padding: 16px 12px; text-align: center; }
    .metric-box h4 { font-size: 0.68rem; text-transform: uppercase; color: #6B7280; letter-spacing: 0.08em; }
    .metric-box p { font-size: 1.6rem; font-family: 'Cormorant Garamond', Georgia, serif; color: #111827; margin-top: 2px; }
    .form-grid { display: flex; flex-direction: column; gap: 14px; }
    .admin-data-card { background: #FAF8F5; border: 1px solid #E5E7EB; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
    .admin-data-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E5E7EB; padding-bottom: 8px; }

    /* Toast Notification */
    #galleryToast {
      position: fixed;
      top: 16px;
      right: 16px;
      left: 16px;
      z-index: 9999;
      background: #111827;
      color: #FFFFFF;
      padding: 14px 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      border-left: 4px solid #10B981;
      transform: translateY(-80px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    #galleryToast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #galleryToast.error { border-left-color: #EF4444; }
    #galleryToast .toast-title { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: #9CA3AF; }
    #galleryToast .toast-msg { font-size: 0.82rem; color: #F9FAFB; margin-top: 2px; }

    /* Confirm Modal */
    #customConfirmModal { position: fixed; inset: 0; z-index: 9998; background: rgba(17, 24, 39, 0.65); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    #customConfirmModal.show { opacity: 1; pointer-events: auto; }
    .confirm-box { background: #FAF8F5; border: 1px solid #E5E7EB; max-width: 380px; width: 100%; padding: 24px; text-align: center; }

    /* Tablet and Desktop Breakpoints */
    @media (min-width: 768px) {
      .nav-container { height: 80px; padding: 0 24px; }
      .nav-logo { font-size: 1.5rem; }
      .hamburger { display: none; }
      .nav-links-desktop { display: flex; }
      .hero-wrap { flex-direction: row; align-items: center; gap: 40px; padding: 40px 0; }
      .hero-wrap > div { flex: 1; }
      .hero-img-box { height: 380px; }
      .grid-3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 32px; }
      .detail-wrap { flex-direction: row; gap: 40px; }
      .detail-wrap > div:first-child { flex: 1.2; }
      .detail-wrap > div:last-child { flex: 1; }
      .filter-bar { flex-direction: row; justify-content: space-between; align-items: center; }
      .cat-scroll-box { flex-wrap: wrap; overflow-x: visible; }
      .btn-primary, .btn-outline { width: auto; display: inline-block; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .col-full { grid-column: 1 / -1; }
      .admin-grid-metrics { grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .footer-container { flex-direction: row; justify-content: space-between; text-align: left; }
      #galleryToast { left: auto; right: 24px; width: 360px; }
    }
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION -->
  <div id="galleryToast">
    <p class="toast-title" id="toastTitle">Notification</p>
    <p class="toast-msg" id="toastMessage">Action completed successfully.</p>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="customConfirmModal">
    <div class="confirm-box">
      <h3 class="font-serif" style="font-size: 1.5rem; margin-bottom: 8px;">Confirm Action</h3>
      <p id="confirmModalText" style="font-size: 0.85rem; color: #4B5563; margin-bottom: 20px;">Are you sure you want to proceed?</p>
      <div style="display: flex; gap: 10px;">
        <button type="button" id="confirmOkBtn" class="btn-primary" style="background: #DC2626; border-color: #DC2626;">Delete</button>
        <button type="button" onclick="closeConfirmModal()" class="btn-outline">Cancel</button>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="nav-container">
      <button type="button" class="nav-logo font-serif" onclick="navigate('home'); closeMobileMenu();">Kenny's Art</button>
      
      <!-- Desktop Links -->
      <div class="nav-links-desktop">
        <button type="button" class="nav-btn" onclick="navigate('home')">Home</button>
        <button type="button" class="nav-btn" onclick="navigate('gallery')">Gallery</button>
        <button type="button" class="nav-btn" onclick="navigate('about')">About</button>
        <button type="button" class="nav-btn" onclick="navigate('contact')">Contact</button>
        <button type="button" class="nav-btn nav-btn-admin" onclick="navigate('admin')">ADMIN</button>
        <a href="https://wa.me/60195232410" target="_blank" class="btn-wa">WhatsApp</a>
      </div>

      <!-- Animated Hamburger Button -->
      <button type="button" class="hamburger" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Mobile Drawer Menu -->
    <div id="mobileDrawer">
      <button type="button" class="mobile-nav-link font-serif" onclick="navigate('home'); closeMobileMenu();">Home</button>
      <button type="button" class="mobile-nav-link font-serif" onclick="navigate('gallery'); closeMobileMenu();">The Gallery</button>
      <button type="button" class="mobile-nav-link font-serif" onclick="navigate('about'); closeMobileMenu();">About Kenny</button>
      <button type="button" class="mobile-nav-link font-serif" onclick="navigate('contact'); closeMobileMenu();">Contact Artist</button>
      <button type="button" class="mobile-nav-link font-serif" style="color: #9CA3AF;" onclick="navigate('admin'); closeMobileMenu();">Admin Portal</button>
      <a href="https://wa.me/60195232410" target="_blank" class="btn-primary" style="margin-top: 16px;">WhatsApp Kenny</a>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="app">
    <div style="text-align: center; padding: 60px 0; color: #6B7280; font-size: 0.85rem; letter-spacing: 0.15em;">
      LOADING KENNY'S ART...
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-container">
      <div>
        <p class="font-serif" style="font-size: 1.25rem; font-weight: 600; text-transform: uppercase;">Kenny's Art</p>
        <p style="color: #6B7280; margin-top: 2px;">Original Paintings. Stories. Emotions.</p>
      </div>
      <div style="display: flex; gap: 16px; justify-content: center; align-items: center;">
        <a href="mailto:kanages.m@gmail.com" style="color: #4B5563; text-decoration: none;">Email</a>
        <a href="https://wa.me/60195232410" target="_blank" style="color: #4B5563; text-decoration: none;">WhatsApp</a>
        <button type="button" class="nav-btn nav-btn-admin" onclick="navigate('admin')">Admin</button>
      </div>
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwenIQBPTzrgx0mnFsHucc3Yk-6wFcAYGaYUDp0RRiMgP7tJyNWV31ykmxIP6PuWaiT/exec";
    
    let appData = { paintings: [], settings: {} };
    let currentAdminPassword = sessionStorage.getItem('adminToken') || null;
    let toastTimeout = null;

    function toggleMobileMenu() {
      const drawer = document.getElementById('mobileDrawer');
      const burger = document.getElementById('hamburgerBtn');
      drawer.classList.toggle('open');
      burger.classList.toggle('open');
      document.body.style.overflow = drawer.classList.contains('open') ? 'hidden' : 'auto';
    }

    function closeMobileMenu() {
      const drawer = document.getElementById('mobileDrawer');
      const burger = document.getElementById('hamburgerBtn');
      drawer.classList.remove('open');
      burger.classList.remove('open');
      document.body.style.overflow = 'auto';
    }

    function notify(message, type = 'success', title = null) {
      const toast = document.getElementById('galleryToast');
      const titleEl = document.getElementById('toastTitle');
      const msgEl = document.getElementById('toastMessage');

      if (toastTimeout) clearTimeout(toastTimeout);
      titleEl.innerText = title || (type === 'error' ? 'Attention' : 'Success');
      msgEl.innerText = message;

      if (type === 'error') toast.classList.add('error');
      else toast.classList.remove('error');

      toast.classList.add('show');
      toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    let onConfirmCallback = null;
    function openConfirmModal(msg, onConfirm) {
      document.getElementById('confirmModalText').innerText = msg;
      onConfirmCallback = onConfirm;
      document.getElementById('confirmOkBtn').onclick = function() {
        closeConfirmModal();
        if (onConfirmCallback) onConfirmCallback();
      };
      document.getElementById('customConfirmModal').classList.add('show');
    }

    function closeConfirmModal() {
      document.getElementById('customConfirmModal').classList.remove('show');
    }

    window.onload = function() {
      fetchGalleryData();
    };

    function fetchGalleryData(callback) {
      fetch(`${API_URL}?action=getData`)
        .then(res => res.json())
        .then(data => {
          appData = data || { paintings: [], settings: {} };
          if (callback) {
            callback();
          } else {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#art-')) {
              navigate('artwork', hash.replace('#art-', ''));
            } else if (hash === '#gallery') {
              navigate('gallery');
            } else if (hash === '#about') {
              navigate('about');
            } else if (hash === '#contact') {
              navigate('contact');
            } else {
              navigate('home');
            }
          }
        })
        .catch(err => {
          document.getElementById('app').innerHTML = `<div style="text-align:center; padding: 40px; color: #DC2626;">Error connecting to gallery server. Please refresh.</div>`;
        });
    }

    function navigate(view, param) {
      window.scrollTo(0, 0);
      const app = document.getElementById('app');
      if (view === 'home') { window.location.hash = ''; renderHome(app); }
      else if (view === 'gallery') { window.location.hash = 'gallery'; renderGallery(app); }
      else if (view === 'artwork') { window.location.hash = 'art-' + param; renderArtwork(app, param); }
      else if (view === 'about') { window.location.hash = 'about'; renderAbout(app); }
      else if (view === 'contact') { window.location.hash = 'contact'; renderContact(app); }
      else if (view === 'admin') { renderAdminRoute(app); }
    }

    // 1. HOME VIEW
    function renderHome(container) {
      const featured = (appData.paintings || []).filter(p => p.featured && p.status !== 'Sold');
      const heroImage = featured[0]?.mainImageURL || appData.paintings[0]?.mainImageURL || 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1200&q=80';

      container.innerHTML = `
        <div class="hero-wrap">
          <div>
            <p style="font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: #6B7280; margin-bottom: 6px;">Original Paintings</p>
            <h1 class="font-serif" style="font-size: 2.75rem; line-height: 1.1; margin-bottom: 16px;">Kenny's Art</h1>
            <p style="color: #4B5563; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6;">Original Paintings. Stories. Emotions. Explore an exclusive collection created with passion, texture, and moments in time.</p>
            <div style="display: flex; gap: 12px; flex-direction: column;">
              <button type="button" class="btn-primary" onclick="navigate('gallery')">Explore Gallery</button>
              <a href="https://wa.me/60195232410" target="_blank" class="btn-outline">WhatsApp Kenny</a>
            </div>
          </div>
          <div class="hero-img-box">
            <img src="${heroImage}" alt="Hero Artwork">
          </div>
        </div>

        <div style="border-top: 1px solid #E5E7EB; padding-top: 32px; margin-top: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
            <div>
              <p style="font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: #6B7280;">Curated</p>
              <h2 class="font-serif" style="font-size: 2rem;">Featured Works</h2>
            </div>
            <button type="button" onclick="navigate('gallery')" style="background: none; border: none; font-size: 0.78rem; text-decoration: underline; cursor: pointer;">View All</button>
          </div>
          <div class="grid-3">
            ${featured.map(renderCardHtml).join('')}
          </div>
        </div>
      `;
    }

    // 2. GALLERY VIEW
    function renderGallery(container) {
      const categories = ['All', ...new Set((appData.paintings || []).map(p => p.category).filter(Boolean))];
      container.innerHTML = `

    function renderCardHtml(p) {
      const badgeCls = p.status === 'Available' ? 'badge-avail' : (p.status === 'Reserved' ? 'badge-res' : 'badge-sold');
      return `
        <div class="art-card" onclick="navigate('artwork', '${p.id}')">

            <img src="${p.mainImageURL}" alt="${p.title}" loading="lazy">
            <span class="badge ${badgeCls}">${p.status}</span>
          </div>
          <div class="card-body">
            <h3 class="font-serif card-title">${p.title}</h3>
            <p class="card-meta">${p.medium} • ${p.dimensions}</p>
            <p class="card-price">${p.currency} ${Number(p.price).toLocaleString()}</p>
          </div>
        </div>
      `;
    }

    let activeFilterCat = 'All';
    function filterByCat(c) {
      activeFilterCat = c;
      const btns = document.querySelectorAll('#catButtons button');
      btns.forEach(b => {
        if (b.innerText === c) {
          b.style.background = '#111827';
          b.style.color = '#FFF';
        } else {
          b.style.background = 'transparent';
          b.style.color = '#111827';
        }
      });
      filterGallery();
    }

    function filterGallery() {
      const q = (document.getElementById('gSearch')?.value || '').toLowerCase();
      const filtered = (appData.paintings || []).filter(p => {
        const matchC = activeFilterCat === 'All' || p.category === activeFilterCat;
        const matchQ = !q || p.title.toLowerCase().includes(q) || (p.medium && p.medium.toLowerCase().includes(q));
        return matchC && matchQ;
      });
      document.getElementById('galleryList').innerHTML = filtered.length ? filtered.map(renderCardHtml).join('') : '<p style="text-align:center; padding: 40px 0; color:#6B7280; font-size: 0.85rem;">No paintings match your filter.</p>';
    }

    // 3. ARTWORK DETAIL VIEW

    function copyArtworkLink(url) {
      if (navigator.clipboard) {

        });
      } else {
        prompt("Copy this link:", url);
      }
    }

    function nativeShareArtwork(title, text, url) {
      if (navigator.share) {
        navigator.share({ title: title + " | Kenny's Art", text: text, url: url }).catch(() => {});
      } else {
        copyArtworkLink(url);
      }

    function openInlineEnquiry(type, id, title, price) {
      const box = document.getElementById('inlineEnquiryContainer');
      if (!box) return;
      box.style.display = 'block';
      box.innerHTML = `
        <h3 class="font-serif" style="font-size: 1.35rem; margin-bottom: 4px;">${type === 'Reservation' ? 'Request Reservation' : 'Submit Enquiry'}</h3>
        <p style="font-size: 0.72rem; color: #6B7280; margin-bottom: 14px;">${type === 'Reservation' ? 'Submitting will immediately mark this painting as RESERVED.' : 'Send a direct inquiry about this painting.'}</p>

          <p class="font-serif" style="font-size: 1.3rem;">Thank you!</p>
          <p style="font-size: 0.8rem; color: #4B5563; margin-top: 4px;">Your request has been received. Kenny will contact you shortly.</p>
        </div>
      `;
      box.scrollIntoView({ behavior: 'smooth' });
    }

    function handleSendEnquiry(e, type, id, title, price) {
      e.preventDefault();
      const btn = document.getElementById('enqBtn');
      btn.innerText = "Submitting...";
      btn.disabled = true;

      const payload = {
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        email: document.getElementById('custEmail').value,
        message: document.getElementById('custMsg').value,
        paintingId: id,
        paintingTitle: title,
        artworkPrice: price,
        enquiryType: type
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "submitEnquiry", payload: payload })
      })
      .then(res => res.json())
      .then(res => {
        e.target.style.display = 'none';
        document.getElementById('enqSuccess').style.display = 'block';
        notify(type === 'Reservation' ? "Artwork reserved!" : "Enquiry sent!");
        fetchGalleryData(function() {
          if (type === 'Reservation') setTimeout(() => navigate('artwork', id), 2000);
        });
      })
      .catch(err => {
        btn.innerText = "Submit Request";
        btn.disabled = false;
        notify("Failed to submit request. Please try WhatsApp.", "error");
      });
    }

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getAdminData", password: currentAdminPassword })
      })

        if (res.success && res.data) {
          renderAdminDashboard(container, res.data);
        } else {
          throw new Error(res.message || "Invalid password");

    function handleDirectAdminLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById('passInput').value;
      const btn = document.getElementById('adminLogBtn');
      const err = document.getElementById('loginErrMsg');

      btn.innerText = "Unlocking...";
      btn.disabled = true;
      err.style.display = 'none';

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getAdminData", password: pwd })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success && res.data) {
          currentAdminPassword = pwd;
          sessionStorage.setItem('adminToken', pwd);
          notify("Welcome back, Kenny.");
          renderAdminDashboard(document.getElementById('app'), res.data);
        } else {
          btn.innerText = "Unlock Dashboard";
          btn.disabled = false;
          err.style.display = 'block';
        }
      })
      .catch(() => {
        btn.innerText = "Unlock Dashboard";
        btn.disabled = false;
        err.style.display = 'block';
      });
    }

      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      const fileInput = document.getElementById('pFile');
      const directUrl = document.getElementById('pDirectUrl').value.trim();

      btn.innerText = "Processing...";
      btn.disabled = true;

      const obj = {
        id: document.getElementById('pId').value,
        title: document.getElementById('pTitle').value,
        price: document.getElementById('pPrice').value,
        medium: document.getElementById('pMedium').value,
        dimensions: document.getElementById('pDimensions').value,
        year: '2026',
        category: document.getElementById('pCategory').value,
        status: document.getElementById('pStatus').value,
        featured: document.getElementById('pFeatured').checked,
        mainImageURL: directUrl,
        description: document.getElementById('pDesc').value,
        story: document.getElementById('pStory').value
      };

      if (fileInput.files.length > 0) {
        btn.innerText = "Uploading Image...";
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "uploadImage",
              password: currentAdminPassword,
              fileData: { base64: evt.target.result, mimeType: file.type, filename: file.name }
            })
          })
          .then(res => res.json())
          .then(uploadRes => {
            obj.mainImageURL = uploadRes.fileUrl;
            commitSavePainting(obj, btn);
          })
          .catch(err => {
            notify("Drive upload warning: " + err.message, "error");
            btn.innerText = "Save Painting";
            btn.disabled = false;
          });
        };
        reader.readAsDataURL(file);
      } else {
        if (!obj.mainImageURL) {
          obj.mainImageURL = 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1200&q=80';
        }
        commitSavePainting(obj, btn);
      }
    }

    function commitSavePainting(obj, btn) {
      btn.innerText = "Saving...";
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "savePainting", password: currentAdminPassword, paintingData: obj })
      })
      .then(res => res.json())
      .then(() => {
        btn.innerText = "Save Painting";
        btn.disabled = false;
        notify("Painting saved successfully!");
        resetForm();
        fetchGalleryData(function() {
          renderAdminRoute(document.getElementById('app'));
        });
      })
      .catch(err => {
        notify("Error: " + err.message, "error");
        btn.innerText = "Save Painting";
        btn.disabled = false;
      });
    }

    function handleDeleteArt(id) {
      openConfirmModal("Are you sure you want to permanently delete this artwork from the gallery?", function() {
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "deletePainting", password: currentAdminPassword, paintingId: id })
        })
        .then(res => res.json())
        .then(() => {
          notify("Artwork deleted.");
          fetchGalleryData(function() {
            renderAdminRoute(document.getElementById('app'));
          });
        })
        .catch(err => {
          notify("Delete failed: " + err.message, "error");
        });
      });
    }

    function handleEnquiryStatus(rowIndex, newStatus) {
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateEnquiry", password: currentAdminPassword, rowIndex: rowIndex, status: newStatus })
      })
      .then(() => notify("Enquiry status updated."));
    }

    function adminLogout() {
      currentAdminPassword = null;
      sessionStorage.removeItem('adminToken');
      notify("Logged out successfully.");
      navigate('home');
    }
  </script>
</body>
</html>
